services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ticketpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ticketpilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketpilot -d ticketpilot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://ticketpilot:${POSTGRES_PASSWORD}@db:5432/ticketpilot
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: ["node", "dist/server/worker.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://ticketpilot:${POSTGRES_PASSWORD}@db:5432/ticketpilot
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
