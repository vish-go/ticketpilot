name: Verify TicketPilot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ticketpilot
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: ticketpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketpilot -d ticketpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://ticketpilot:ci-test-password@localhost:5432/ticketpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          DATABASE_URL: postgres://ticketpilot:ci-test-password@localhost:5432/ticketpilot_test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
          if-no-files-found: ignore
